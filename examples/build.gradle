// The six canonical flows. Every Hanzo SDK ships the same six under
// examples/<flow>/ — the list is data in hanzoai/openapi flows.yaml, not a
// choice this repo makes.
//
// They are compiled by `./gradlew build`, which is the point: an example that
// does not compile is worse than no example.

// One source directory: examples/<flow>/<Flow>.java, plus Hanzo.java beside
// them, which is the single place HANZO_API_KEY, HANZO_BASE_URL and
// HANZO_ORG_ID are resolved.
sourceSets.main.java {
    srcDirs = ['.']
    exclude 'build/**'
}

dependencies {
    implementation project(':hanzo-java-cloud')
}

// ./gradlew hello | chat | money | store | agent | tools
['hello', 'chat', 'money', 'store', 'agent', 'tools'].each { flow ->
    tasks.register(flow, JavaExec) {
        group = 'hanzo'
        description = "Run the $flow example."
        mainClass = "ai.hanzo.cloud.examples.${flow.capitalize()}"
        classpath = sourceSets.main.runtimeClasspath
    }
}

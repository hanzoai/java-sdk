// The repo root owns the build. The generator owns
// hanzo-java-cloud/src/main/java/ai/hanzo/cloud and nothing else — see
// scripts/generate.sh.

subprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
    }

    // Java 11 is the floor. Compiled with whatever JDK is present, targeted at
    // 11, so the classes come out at major version 55.
    java {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    tasks.withType(JavaCompile).configureEach {
        // Schema descriptions are copied into the sources as UTF-8; the
        // platform default would mangle them.
        options.encoding = 'UTF-8'
        // 2,671 sources in one compile. The Gradle daemon heap in
        // gradle.properties is not the compiler's, so fork one.
        options.fork = true
        options.forkOptions.jvmArgs = ['-Xmx6g']
    }
}

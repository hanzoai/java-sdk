name: Release
# Maven Central is the one thing hanzo.yml cannot express: `binaries:` ships the
# jar with the tag, but the Central upload needs a PGP signature and a registry
# credential that the shared CI does not model. Both come from KMS
# (kms.hanzo.ai) and are injected here; neither is ever on disk or in this repo.
#
# Publishing is a tag. The version is the artifact's own, in
# hanzo-java-cloud/build.gradle — the document versions itself `v1` and says
# nothing about a client — so a release is: regenerate, set it, tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: ./gradlew --no-daemon :hanzo-java-cloud:compileJava :examples:compileJava
      - name: Publish to Maven Central
        run: ./gradlew --no-daemon :hanzo-java-cloud:publishMavenPublicationToCentralRepository
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

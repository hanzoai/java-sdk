name: Release
# Publishing is a tag. The version is the artifact's own, in
# hanzo-java-cloud/build.gradle — the document versions itself `v1` and says
# nothing about a client — so a release is: regenerate, set it, tag.
#
# Maven Central is the one thing hanzo.yml cannot express. `binaries:` ships the
# jar with the tag; the Central upload needs a registry credential and a PGP
# signature, which the shared CI does not model. Both are read from KMS below,
# the same surface every other credential in this fleet comes from — the only
# things the forge holds are KMS_CLIENT_ID and KMS_CLIENT_SECRET.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}

      - name: Read the Central credential from KMS
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://api.hanzo.ai' }}
        run: |
          set -uo pipefail
          T=$(curl -sf "$KMS_ENDPOINT/v1/kms/auth/login" -H 'Content-Type: application/json' \
                -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}" \
              | jq -r '.accessToken // empty')
          [ -n "$T" ] || { echo "::error::KMS login failed at $KMS_ENDPOINT for client $KMS_CLIENT_ID"; exit 1; }
          # Named one at a time, and absence is fatal. An empty credential here
          # reaches Central as a 401, and an empty key reaches it as an unsigned
          # deployment its validator refuses hours later — both a long way from
          # the missing value. Say which name is missing, at the door.
          for n in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE; do
            v=$(curl -sf "$KMS_ENDPOINT/v1/kms/secrets/$n?env=prod" -H "Authorization: Bearer $T" | jq -r '.value // empty')
            [ -n "$v" ] || { echo "::error::$n is not in KMS (org hanzo, env prod). Maven Central wants a Central Portal user token and an ASCII-armoured PGP key; both belong there before a tag can publish."; exit 1; }
            # A multi-line value masks line by line or not at all.
            printf '%s\n' "$v" | while IFS= read -r l; do [ -n "$l" ] && echo "::add-mask::$l"; done
            printf '%s<<KMS\n%s\nKMS\n' "$n" "$v" >> "$GITHUB_ENV"
          done

      - run: ./gradlew --no-daemon :hanzo-java-cloud:compileJava :examples:compileJava

      - name: Upload to the staging repository
        # Signed here, or not at all: build.gradle makes the signature a
        # condition of this task, so an unsigned upload cannot leave.
        run: ./gradlew --no-daemon :hanzo-java-cloud:publishMavenPublicationToCentralRepository

      - name: Release the staged deployment
        # Gradle's maven-publish is a series of PUTs; nothing in it tells the
        # staging service where one deployment ends. Sonatype separates them by
        # source IP and waits for this call — without it the artifacts sit in an
        # open staging repository and never appear in the Portal, let alone on
        # Central. Same job, same runner, so the same IP that uploaded them.
        # https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/
        run: |
          set -uo pipefail
          NS=$(./gradlew --no-daemon -q :hanzo-java-cloud:properties | sed -n 's/^group: //p')
          curl -s --fail-with-body -X POST \
            -H "Authorization: Bearer $(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/$NS?publishing_type=automatic"

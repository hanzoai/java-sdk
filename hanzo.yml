# Hanzo CI — the ONE way this repo is gated, read by hanzoai/ci.
#
# No `images:` and no `deploy:`: this is a client library. A consumer resolves
# it from Maven Central at a version, so what CI owes is a gate and a jar, not a
# running service.

test:
  - name: sdk-build
    # 2316 generated sources in one compile. If a regeneration produces
    # something that does not compile, it must not reach a tag.
    run: ./gradlew --no-daemon :hanzo-java-cloud:compileJava

  - name: examples-build
    # The six canonical flows, compiled against the client they demonstrate. An
    # example that does not compile is worse than no example, so they are gated
    # rather than merely committed.
    run: ./gradlew --no-daemon :examples:compileJava

  - name: codegen-drift-check
    # The client is generated, so the only thing that can rot is the committed
    # copy. This regenerates from hanzoai/openapi and fails if what is in git is
    # not what the document produces. Needs SPEC_TOKEN — hanzoai/openapi is
    # private.
    run: ./scripts/generate.sh --check

binaries:
  - name: hanzo-java-cloud
    # Built on every push, published only on a tag. `publish` signs with the PGP
    # key CI takes from KMS and uploads to Maven Central; the jar below is the
    # same artifact, kept so a tag carries it even if the upload is unavailable.
    run: ./gradlew --no-daemon :hanzo-java-cloud:assemble
    out: hanzo-java-cloud/build/libs/*.jar

# THE CLIENT LANE — this repo is a PROJECTION of one API document at one version.
#
# hanzoai/cloud's release sends `repository_dispatch: spec-update` carrying
# (version, sha, spec_sha256); hanzoai/ci fetches openapi.yaml AT THAT SHA,
# REFUSES if the bytes hash to anything else, runs `generate:`, writes
# `.spec-lock` beside the code, and — only after the `test:` block below has
# passed over exactly those bytes — commits and cuts a patch.
#
# The document moved from hanzoai/openapi `hanzo.yaml` (hand-merged, 1742 paths,
# fed by nothing, and NOTHING HAS EVER SENT the spec-update this repo listens
# for) to hanzoai/cloud `openapi.yaml` — smaller (1058 paths), emitted from the
# code by each app's own router, and gated on every cloud release. A smaller true
# document beats a larger unverified one.
client:
  generate: ./scripts/generate.sh
  # NO version: — this client's version is a gradle -alpha.N build, not
  # x.y.z, so there is no patch for the lane to derive. Its projection
  # still lands and is still gated; the cut waits for a human, instead of
  # a tag naming bytes under a number nobody chose.
